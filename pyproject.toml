[project]
name = "scannage"
version = "0.1.0"
description = "Home inventory for storage boxes with printed tags"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyJWT>=2.8",
    "psycopg[binary]>=3.2",
    "segno>=1.6",
    "Pillow>=10.3",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "flake8>=7.0",
    "isort>=5.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.isort]
profile = "black"
